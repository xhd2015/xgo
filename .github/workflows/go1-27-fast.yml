name: Go 1-27 Fast

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  test-go1-27-fast:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'

    - name: Test
      run: go run ./script/run-test --log-debug -v --fast

    - name: Verify warm test cache and invalidation
      run: |
        set -euo pipefail
        go build -o "$RUNNER_TEMP/xgo-cache-check" ./cmd/xgo
        bash script/test-warm-cache.sh "$RUNNER_TEMP/xgo-cache-check"
