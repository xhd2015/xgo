# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Next

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  tests-with-go-next:
    # go1.28 preview placeholder; enable when a release candidate is available.
    # go1.27rc2 is covered by go1-27.yml / go1-27-fast.yml.
    # see https://tip.golang.org/doc/devel/release#go1.28
    if: false
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        # Use the full RC tag once published, e.g. '1.28rc1'
        go: [ '1.28' ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      run: |
        curl -fsSL -o go.tar.gz "https://go.dev/dl/go${{matrix.go}}.linux-amd64.tar.gz"
        mkdir setup
        mkdir setup/gopath
        tar -C setup -xzf go.tar.gz
        ls setup
        GOROOT=$PWD/setup/go PATH=$PWD/setup/go/bin:$PATH go version
    
    - name: Test
      run: GOROOT=$PWD/setup/go GOPATH=$PWD/setup/gopath PATH=$PWD/setup/go/bin:$PWD/setup/gopath/bin:$PATH go run ./script/run-test --install-xgo --with-setup --reset-instrument --log-debug -v
